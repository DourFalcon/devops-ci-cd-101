name: Build

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Normalize Docker credentials
      id: docker_creds
      shell: bash
      env:
        RAW_DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        RAW_DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        {
          echo "username<<EOF"
          printf '%s' "$RAW_DOCKER_USERNAME" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          echo
          echo "EOF"
          echo "password<<EOF"
          printf '%s' "$RAW_DOCKER_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          echo
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ steps.docker_creds.outputs.username }}
        password: ${{ steps.docker_creds.outputs.password }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: docker.io/${{ steps.docker_creds.outputs.username }}/devops-flask
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Run Trivy vulnerability scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: docker.io/${{ steps.docker_creds.outputs.username }}/devops-flask:latest
        format: sarif
        output: trivy-results.sarif
      continue-on-error: true
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: trivy-results.sarif
      continue-on-error: true
    
    - name: Image pushed successfully
      run: |
        echo "✓ Docker image built and pushed!"
        echo "Image: docker.io/${{ steps.docker_creds.outputs.username }}/devops-flask:latest"
